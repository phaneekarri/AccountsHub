# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  customerapi:
    image: customerapi
    build:
      context: .
      dockerfile: src/CustomerApi/Dockerfile
      args:
        ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${CUSTOMER_DB_CONNECTION_STRING}
    depends_on:
      - mydb
  mydb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  userauthapi:
    image: userauthapi
    build: 
      context: .
      dockerfile: src/UserAuthApi/Dockerfile
      args:
        ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5028:5028"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDatabase=${AUTH_DB_CONNECTION_STRING}
      - ConnectionStrings__AuthDatabaseMigration=Data Source=host.docker.internal,1433;Database=UserDB;Integrated Security=false;TrustServerCertificate=True;User Id=migrationuser;Password=${AUTH_DB_MIGRATION_PASSWORD}
    depends_on:
      userdb:
        condition: service_healthy

  userdb:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-20.04
    container_name: userdb_container
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${AUTH_DB_SA_PASSWORD}
      - API_USER_PASSWORD=${API_USER_PASSWORD}
      - AUTH_DB_MIGRATION_PASSWORD=${AUTH_DB_MIGRATION_PASSWORD}
    ports:
      - "1433:1433"
    volumes:  
      - sql_data:/var/opt/mssql
      - ./init-db.sh:/tmp/init-db.sh
    command: >
      bash -c "
      /opt/mssql/bin/sqlservr &
      sleep 30 &&
      bash /tmp/init-db.sh &&
      wait"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P '${AUTH_DB_SA_PASSWORD}' -Q 'SELECT 1' && /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P '${AUTH_DB_SA_PASSWORD}' -Q 'SELECT name FROM sys.server_principals WHERE name = \"apiuser\"' | grep -q apiuser"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
   
volumes:
  mysql_data:
  sql_data: